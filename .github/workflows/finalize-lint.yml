name: Finalize lint repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Repair known lint blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              "scripts/build_failure_lab.py",
              "scripts/run_spotcheck.py",
              "tests/test_lexical_ceiling.py",
          ]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("json.loads(l) for l in path.read_text(encoding=\"utf-8\").splitlines() if l.strip()", "json.loads(line) for line in path.read_text(encoding=\"utf-8\").splitlines() if line.strip()")
              path.write_text(text, encoding="utf-8")

          path = Path("src/controlsift/data/generate.py")
          text = path.read_text(encoding="utf-8")
          dead = '''    names = ["Mercury", "Neon"]\n    if rng.random() < 0.5:\n        names = ["Neon", "Mercury"]\n'''
          text = text.replace(dead, "")
          path.write_text(text, encoding="utf-8")
          PY

          ruff check --fix src tests scripts
          ruff check src tests scripts

      - name: Run tests
        run: pytest -q

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_failure_lab.py scripts/run_spotcheck.py tests/test_lexical_ceiling.py src/controlsift/data/generate.py src/controlsift/training/train.py
          if git diff --cached --quiet; then
            echo "No lint repairs needed."
            exit 0
          fi
          git commit -m "Fix final CI lint blockers"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
