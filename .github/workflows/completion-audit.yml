name: ControlSift completion audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/completion-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find stale pre-completion language
        shell: bash
        run: |
          set +e
          echo '=== stale completion-language matches ==='
          git grep -nEi 'video-script\.html|ControlSift_Video_Teleprompter|open-record-pack|video remains|remaining[^[:cntrl:]]*video|record[^[:cntrl:]]*(the|final|capstone|≤5-minute|5-minute)[^[:cntrl:]]*video|record and submit|recording remains|video only|still on you|pending_gpu|blocked on GPU|Gemma pending|null metrics|null[^[:cntrl:]]*until[^[:cntrl:]]*GPU|your next action|remaining calendar|remaining submit step|complete HF/Kaggle Gemma runs|before claiming LLM outcomes' -- . ':!data/**' ':!results/**' ':!*.pptx' ':!*.pdf' || true
          echo '=== potentially unfinished project markers ==='
          git grep -nEi '\b(TODO|TBD|unfinished|not done|not complete)\b' -- . ':!data/**' ':!results/**' ':!*.pptx' ':!*.pdf' || true
          echo '=== end audit ==='
