[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlsift"
version = "1.0.0"
description = "Domain adaptation of Gemma 3 for cybersecurity control-evidence assessment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ControlSift Contributors" }]
keywords = ["nlp", "cybersecurity", "qlora", "evidence-evaluation", "research"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]
notebooks = [
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
]
gpu = [
  "torch>=2.1",
  "transformers>=4.50",
  "datasets>=2.16",
  "accelerate>=0.26",
  "peft>=0.10",
  "trl>=0.14",
  "bitsandbytes>=0.42",
  # peft>=0.16 rejects installed torchao <0.16; pin so Kaggle preinstalls upgrade.
  "torchao>=0.16",
]

[project.scripts]
controlsift-generate = "controlsift.data.generate:main_cli"
controlsift-validate = "controlsift.data.validate:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
