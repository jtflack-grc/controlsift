seed: 42
dataset_version: "1.0.0"
primary_metric: macro_f1
labels:
  - SUFFICIENT
  - PARTIAL
  - INSUFFICIENT
  - IRRELEVANT
  - CONTRADICTORY
unparseable_label: UNPARSEABLE
bootstrap:
  n_resamples: 200
  confidence_level: 0.95
slices:
  - control_domain
  - evidence_type
  - difficulty
  - failure_tags
paths:
  test: data/processed/test.jsonl
  challenge: data/processed/challenge.jsonl
  results_root: results
  figures_dir: reports/figures
  public_results: docs/data/results.json
experiments:
  - majority
  - tfidf
  - gemma_zero_shot
  - gemma_few_shot
  - gemma_qlora
